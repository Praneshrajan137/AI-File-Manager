# electron-builder Configuration
# Packaging configuration for Windows, macOS, and Linux

appId: com.praneshrajan.privatevault
productName: PrivateVault AI
copyright: Copyright © 2025-2026 Praneshrajan
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
asarUnpack:
  - "dist/main/mcpServer.js"
  - "dist/main/embeddingWorker.js"
  - "node_modules/**/*.node"
  - "node_modules/@lancedb/**"
  - "node_modules/onnxruntime-node/**"
  - "node_modules/@huggingface/transformers/**"
  - "node_modules/sharp/**"

# Directories
directories:
  output: dist-packages
  buildResources: build

# Files to include
files:
  - dist/**/*
  - node_modules/**/*
  - package.json

# macOS Configuration
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: build/icon.icns

# Windows Configuration
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico

# Linux Configuration
linux:
  target:
    - AppImage
    - deb
  category: FileManager
  icon: build/icon.png

# NSIS installer configuration (Windows)
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
